name: reproduce paper results
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["src/**", "requirements.txt", ".github/workflows/reproduce.yml"]
permissions:
  contents: write
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-medqa-textbooks-v1
      - name: Run full protocol
        run: PYTHONPATH=src python -m medqa_rag.experiments 2>&1 | tee results/run.log
      - name: Commit results
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results README.md
          git diff --cached --quiet || git commit -m "Update reproduction results [skip ci]"
          git pull --rebase && git push
